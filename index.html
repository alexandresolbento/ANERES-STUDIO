    <script>
      (function() {
        function isBenign(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.indexOf('websocket') !== -1 ||
                 s.indexOf('fechado sem ter sido aberto') !== -1 ||
                 s.indexOf('closed without being opened') !== -1 ||
                 s.indexOf('resizeobserver') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (isBenign(e.message) || (e.error && isBenign(e.error.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (isBenign(reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
